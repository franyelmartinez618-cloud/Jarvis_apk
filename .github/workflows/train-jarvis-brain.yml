name: Entrenar cerebro propio de JARVIS

on:
  push:
    branches:
      - feat/jarvis-native-brain-and-web-runtime-20261030
    paths:
      - "brain/model.py"
      - "brain/tokenizer.py"
      - "brain/train.py"
      - "brain/train_sft.py"
      - "brain/prepare_corpus.py"
      - "brain/prepare_oasst1.py"
      - "brain/generate_curriculum.py"
      - "brain/tests/**"
      - "brain/export_android.py"
      - "brain/evaluate.py"
      - "brain/config*.json"
      - "brain/sft-config.json"
      - "brain/eval/**"
      - "data/seed/**"
      - ".github/workflows/train-jarvis-brain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-brain-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    name: Entrenamiento experimental desde pesos aleatorios
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: brain/requirements.txt

      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r brain/requirements.txt

      - name: Generar ejercicios originales de razonamiento
        run: python brain/generate_curriculum.py --output data/seed/zz_generated_curriculum.jsonl --count 300

      - name: Descargar corpus de conversaciones humanas OASST1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \\
            "https://huggingface.co/datasets/OpenAssistant/oasst1/resolve/main/2023-04-12_oasst_ready.messages.jsonl.gz" \\
            --output "$RUNNER_TEMP/oasst1-ready.messages.jsonl.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \\
            "https://huggingface.co/datasets/OpenAssistant/oasst1/resolve/main/LICENSE" \\
            --output data/raw/OASST-LICENSE
          python brain/prepare_oasst1.py \\
            --input "$RUNNER_TEMP/oasst1-ready.messages.jsonl.gz" \\
            --output data/raw/oasst_es_human.jsonl \\
            --license-file data/raw/OASST-LICENSE \\
            --registry data/raw/SOURCES.json \\
            --min-pairs 500

      - name: Construir corpus original y autorizado de JARVIS
        run: |
          python brain/prepare_corpus.py --input data/seed --extra-input data/raw --output data/processed/corpus.txt
          python -c "from pathlib import Path; p=Path('data/processed/corpus.txt'); print(f'Corpus JARVIS: {p.stat().st_size:,} bytes'); assert p.stat().st_size >= 1000000"
          python -c "import json; m=json.load(open('data/processed/corpus.manifest.json', encoding='utf-8')); print(f'Documentos: {len(m):,}; fuentes: {sorted(set(x[\"source\"] for x in m))}')"

      - name: Entrenar Transformer desde inicialización aleatoria
        run: |
          python brain/train.py --config brain/config.json --data data/processed/corpus.txt --out checkpoints/jarvis.pt

      - name: Ajustar el modelo a instrucciones de JARVIS
        run: |
          python brain/train_sft.py --checkpoint checkpoints/jarvis.pt --data data/seed --extra-data data/raw --config brain/sft-config.json --out checkpoints/jarvis-sft.pt

      - name: Evaluar respuestas fuera del corpus de entrenamiento
        run: |
          python brain/evaluate.py --checkpoint checkpoints/jarvis-sft.pt --questions brain/eval/questions.jsonl --output reports/jarvis-quality.json --max-tokens 180

      - name: Bloquear checkpoints que no superen la evaluación
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/jarvis-quality.json").read_text(encoding="utf-8"))
          print(json.dumps({key: report[key] for key in (
              "quality_passed", "question_count", "nonempty_rate",
              "average_keyword_recall", "average_repeated_trigram_ratio"
          )}, ensure_ascii=False))
          if report.get("quality_passed") is not True:
              raise SystemExit("Checkpoint rechazado: no se exportará ni se integrará en Android.")
          PY

      - name: Exportar checkpoint aprobado al formato JARVIS01
        run: |
          python brain/export_android.py --checkpoint checkpoints/jarvis-sft.pt --output brain/artifacts/jarvis-brain.bin
          python -m json.tool brain/artifacts/jarvis-brain.json

      - name: Publicar pesos e informe de entrenamiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-brain-training-experiment
          path: |
            checkpoints/jarvis.pt
            checkpoints/jarvis-last.pt
            checkpoints/jarvis.metrics.jsonl
            checkpoints/jarvis-sft.pt
            checkpoints/jarvis-sft-last.pt
            reports/jarvis-quality.json
            data/processed/corpus.manifest.json
            data/raw/SOURCES.json
            data/raw/OASST-LICENSE
            brain/artifacts/jarvis-brain.bin
            brain/artifacts/jarvis-brain.json
          if-no-files-found: warn
          retention-days: 14
