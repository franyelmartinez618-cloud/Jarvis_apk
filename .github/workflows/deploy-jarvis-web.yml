name: Publicar interfaz web de Jarvis
on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/deploy-jarvis-web.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Versionar recursos para forzar actualización de caché
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          build = os.environ["BUILD_ID"][:12]
          app = Path("web/app.js")
          text = app.read_text(encoding="utf-8")
          text, count = re.subn(r'const BUILD="[^"]+"', f'const BUILD="web-{build}"', text, count=1)
          if count != 1:
              raise SystemExit("No se encontró el identificador de build en web/app.js")
          app.write_text(text, encoding="utf-8")
          sw = Path("web/sw.js")
          text = sw.read_text(encoding="utf-8")
          text, count = re.subn(r'const CACHE="[^"]+"', f'const CACHE="jarvis-web-shell-{build}"', text, count=1)
          if count != 1:
              raise SystemExit("No se encontró el identificador de caché en web/sw.js")
          sw.write_text(text, encoding="utf-8")
          PY
      - name: Validar aplicación web
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s web/sw.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
