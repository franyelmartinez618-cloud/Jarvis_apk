name: Publicar interfaz web de Jarvis
on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/deploy-jarvis-web.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate web application
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s web/sw.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
