name: Publicar interfaz web de Jarvis

on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/deploy-jarvis-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verificar el núcleo web
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/app.js
          test -f web/version.json
          echo "Interfaz local comprobada."

      - name: Subir archivos web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Publicar la web
        id: deployment
        uses: actions/deploy-pages@v4
