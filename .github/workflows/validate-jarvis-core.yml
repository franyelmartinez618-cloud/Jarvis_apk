name: Validar núcleo propio y web de JARVIS
on:
  push:
    branches: [ "feat/jarvis-native-brain-and-web-runtime-20261030" ]
  pull_request:
    branches: [ main ]
    paths:
      - "brain/**"
      - "data/seed/**"
      - "scripts/prepare_jarvis_native_brain.py"
      - "scripts/prepare_jarvis_local_brain.py"
      - "scripts/prepare_jarvis_voice_unlock.py"
      - "brain/tests/**"
      - ".github/workflows/prepare-jarvis.yml"
      - "web/**"
      - ".github/workflows/validate-jarvis-core.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check Python
        run: python -m compileall -q brain
      - name: Compile generated Android patcher
        run: python -m py_compile scripts/prepare_jarvis_native_brain.py scripts/prepare_jarvis_local_brain.py scripts/prepare_jarvis_voice_unlock.py
      - name: Prepare the project seed corpus
        run: |
          python brain/prepare_corpus.py --input data/seed --output "$RUNNER_TEMP/jarvis-seed.txt"
          test -s "$RUNNER_TEMP/jarvis-seed.txt"
      - name: Check native brain runtime contract
        run: |
          grep -q 'JARVIS01' brain/android/JarvisNativeBrain.kt
          grep -q 'JarvisNativeBrain' scripts/prepare_jarvis_native_brain.py
          ! grep -E -i 'qwen|litertlm|huggingface|sendMessageAsync' brain/android/JarvisNativeBrain.kt
      - name: Install CPU PyTorch for model tests
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r brain/requirements.txt
      - name: Test tokenizer and training split
        working-directory: brain
        run: python -m unittest discover -s tests -v
      - name: Syntax-check web runtime
        run: node --check web/app.js && node --check web/sw.js
      - name: Validate PWA manifest
        run: python -m json.tool web/manifest.webmanifest >/dev/null
