name: Construir APK de Jarvis

on:
  push:
    branches: [ main, "fix/jarvis-voice-to-voice-no-biometric-20261030" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JARVIS_SIGNING_READY: ${{ secrets.JARVIS_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer y preparar el proyecto
        shell: bash
        run: |
          set -euo pipefail
          test -f jarvis-android.zip
          mkdir -p "$RUNNER_TEMP/jarvis-src"
          unzip -q jarvis-android.zip -d "$RUNNER_TEMP/jarvis-src"
          PROJECT="$RUNNER_TEMP/jarvis-src/jarvis-android"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])

          # Flexible local wake phrases: a detected "jarvis" token starts conversation.
          wake = root / "app/src/main/java/com/jarvis/personal/WakeWordListener.kt"
          text = wake.read_text(encoding="utf-8")
          lines = text.splitlines()
          found = False
          for index, line in enumerate(lines):
              if "private const val GRAMMAR =" in line:
                  lines[index] = r'        private const val GRAMMAR = "[\"jarvis\", \"hola jarvis\", \"oye jarvis\", \"ey jarvis\", \"jarvis estas ahi\", \"jarvis estas despierto\", \"jarvis estas activo\", \"jarvis me escuchas\", \"jarvis despierta\", \"jarvis activa\", \"jarvis necesito ayuda\", \"[unk]\"]"'
                  found = True
                  break
          if not found:
              raise SystemExit("No se encontró la gramática de WakeWordListener.kt")
          text = "\n".join(lines) + "\n"
          old = 'if (text.contains("jarvis") && text.contains("activate")) {'
          if old not in text:
              raise SystemExit("No se encontró la condición original de despertar Jarvis.")
          text = text.replace(old, 'if (text.contains("jarvis")) {', 1)
          wake.write_text(text, encoding="utf-8")
          PY
          python3 "$GITHUB_WORKSPACE/scripts/prepare_jarvis.py" "$PROJECT"
          python3 "$GITHUB_WORKSPACE/scripts/prepare_jarvis_updates.py" "$PROJECT"
          python3 "$GITHUB_WORKSPACE/scripts/prepare_jarvis_voice_unlock.py" "$PROJECT"
          echo "=== JARVIS MODEL INITIALIZATION DIAGNOSTIC ==="
          grep -n -E -C 5 'Model\\(|model-es|copyAssets|copyAsset|missing|not found|modelo de voz|private var model|lateinit var model' "$PROJECT/app/src/main/java/com/jarvis/personal/JarvisService.kt" || true
          echo "=== PACKAGED VOSK ASSETS ==="
          find "$PROJECT/app/src/main/assets" -maxdepth 3 -type f | head -35 || true
          echo "=== SERVICE LIFECYCLE ==="
          grep -n -E -C 4 'running|onStartCommand|onCreate|onDestroy|stopSelf|stopForeground|startForeground' "$PROJECT/app/src/main/java/com/jarvis/personal/JarvisService.kt" | head -180 || true
          MANIFEST="$PROJECT/app/src/main/AndroidManifest.xml"
          SERVICE="$PROJECT/app/src/main/java/com/jarvis/personal/JarvisService.kt"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'AudioRecord' "$SERVICE"
          grep -q 'Recognizer' "$SERVICE"
          grep -q 'speak(' "$SERVICE"
          if grep -R -n -E 'OwnerVoiceVerifier|VoiceSetupActivity|verifiedVoice' "$PROJECT/app/src/main/java"; then
            echo "ERROR: speaker biometrics remain in the generated Android sources."
            exit 1
          fi
          grep -q 'text.contains("jarvis")' "$PROJECT/app/src/main/java/com/jarvis/personal/WakeWordListener.kt"
          echo "JARVIS_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Descargar modelo de español para activación offline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip \
            --output "$RUNNER_TEMP/vosk-es.zip"
          unzip -q "$RUNNER_TEMP/vosk-es.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/vosk-model-small-es-0.42"
          mkdir -p "$JARVIS_PROJECT/app/src/main/assets"
          mv "$RUNNER_TEMP/vosk-model-small-es-0.42" "$JARVIS_PROJECT/app/src/main/assets/model-es"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de depuración
        shell: bash
        run: |
          set -euo pipefail
          cd "$JARVIS_PROJECT"
          gradle --no-daemon --stacktrace -PjarvisVersionCode="$GITHUB_RUN_NUMBER" assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Preparar firma estable para actualizaciones
        if: ${{ env.JARVIS_SIGNING_READY == 'true' }}
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          test -s "$RUNNER_TEMP/jarvis-release.jks"
          echo "Keystore estable preparado (el contenido no se imprime)."

      - name: Compilar APK firmado para actualizar instalaciones existentes
        if: ${{ env.JARVIS_SIGNING_READY == 'true' }}
        env:
          ORG_GRADLE_PROJECT_jarvisStoreFile: ${{ runner.temp }}/jarvis-release.jks
          ORG_GRADLE_PROJECT_jarvisStorePassword: JarvisKeystorePassword_2026
          ORG_GRADLE_PROJECT_jarvisKeyAlias: jarvis
          ORG_GRADLE_PROJECT_jarvisKeyPassword: JarvisKeystorePassword_2026
        shell: bash
        run: |
          set -euo pipefail
          cd "$JARVIS_PROJECT"
          gradle --no-daemon --stacktrace -PjarvisVersionCode="$GITHUB_RUN_NUMBER" assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/output/jarvis.apk"

      - name: Publicar versión permanente para el actualizador
        if: ${{ github.ref == 'refs/heads/main' && env.JARVIS_SIGNING_READY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Jarvis v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: output/jarvis.apk
          generate_release_notes: true

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 7
