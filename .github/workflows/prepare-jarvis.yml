name: Construir APK de Jarvis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el código fuente
        shell: bash
        run: |
          set -euo pipefail
          test -f jarvis-android.zip || { echo "::error::Falta jarvis-android.zip en la raíz del repositorio."; exit 1; }
          mkdir -p "$RUNNER_TEMP/jarvis-source"
          unzip -q jarvis-android.zip -d "$RUNNER_TEMP/jarvis-source"
          PROJECT="$RUNNER_TEMP/jarvis-source/jarvis-android"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/jarvis/personal/MainActivity.kt"
          echo "JARVIS_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Descargar el modelo de activación por voz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JARVIS_PROJECT/app/src/main/assets"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            --output "$RUNNER_TEMP/vosk-model.zip"
          unzip -q "$RUNNER_TEMP/vosk-model.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/vosk-model-small-en-us-0.15"
          mv "$RUNNER_TEMP/vosk-model-small-en-us-0.15" "$JARVIS_PROJECT/app/src/main/assets/model-en"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de depuración
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ${{ runner.temp }}/jarvis-source/jarvis-android

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: ${{ runner.temp }}/jarvis-source/jarvis-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
